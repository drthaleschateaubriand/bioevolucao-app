name: Publicar BioEvolução
on:
  push:
    branches: ["Copy-of-MASTER-3-SUPABASE"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bioevolucao-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Gerar icones PNG do aplicativo
        run: python3 scripts/generate_icons.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar
        id: publish
        uses: actions/deploy-pages@v4
